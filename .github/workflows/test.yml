name: engine tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"
      - name: Install local transport tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap jq socat tmux
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      # The rootless overlay fixture bind-mounts /nix/store to run sh.
      - run: nix shell --inputs-from . nixpkgs#bash --command mix test
      - run: mix escript.build
