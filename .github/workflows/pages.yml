name: Deploy site (landing + docs)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git-revision-date can read last-modified dates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Every language version must be built from the current English source and translations, with share
      # images rendered from the current headlines (website/i18n/build.lock.json, og.lock.json). On a mismatch
      # the job stops here and the last good version stays live.
      - name: Landing page and its translations are built from their sources and pass their tests
        run: |
          node --test website/tests/*.mjs
          node website/build.mjs --check

      - name: Install imaging deps (for social cards)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant

      - name: Install MkDocs Material
        run: pip install "mkdocs-material[imaging]>=9.5,<10" mkdocs-git-revision-date-localized-plugin

      - name: Build docs into _site/docs
        run: mkdocs build --strict --site-dir _site/docs

      - name: Place landing page at site root
        run: |
          rsync -a --exclude src --exclude tests --exclude tools --exclude i18n --exclude build.mjs website/ _site/
          touch _site/.nojekyll
          cp SKILL.md _site/skill.md
          {
            echo "# GenSwarms — full documentation"
            echo
            echo "> Concatenated from the GenSwarms repository for LLM ingestion."
            echo "> Source: https://github.com/genlayerlabs/genswarms"
            for f in SKILL.md docs/README.md docs/getting-started.md docs/configuration.md \
                     docs/cli.md docs/architecture.md docs/messaging.md docs/objects.md \
                     docs/skills.md docs/backends.md docs/containers.md docs/rest-api.md \
                     docs/websocket.md docs/programmatic.md docs/observability.md \
                     docs/testing.md docs/troubleshooting.md; do
              echo; echo "---"; echo; cat "$f"
            done
          } > _site/llms-full.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Every version served right: 200s, /es -> /es/, lang, title, canonical, hreflang
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify the live language versions
        run: |
          for i in 1 2 3 4 5; do
            node website/build.mjs --verify https://genswarms.com/ && exit 0
            sleep 30
          done
          exit 1
